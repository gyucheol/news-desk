# 관심 종목(tools/disclosure/watchlist.json)의 새 공시를 5분마다 확인해 텔레그램으로 보낸다.
# 예약 실행(schedule)은 저장소 기본 브랜치에 있는 이 파일만 동작한다.
# 필요한 저장소 시크릿: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# 선택 시크릿: ANTHROPIC_API_KEY(한국어 요약), DART_API_KEY, SEC_USER_AGENT(연락처 이메일 포함)
# 선택 변수(vars): CLAUDE_MODEL(요약 모델, 기본 claude-opus-5-5)
name: disclosure-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disclosure-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install summary SDK
        run: pip install --quiet anthropic==1.15.0

      # 이미 보낸 공시 번호(상태)는 Actions 캐시에 보관한다. 가장 최근 것을 불러온다.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .disclosure-state
          key: disclosure-state-${{ github.run_id }}
          restore-keys: disclosure-state-

      - name: Check filings and notify
        id: watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python tools/disclosure/watch.py

      # 상태가 바뀐 때(새 공시를 보냈거나 종목을 처음 등록했을 때)만 저장한다.
      # 전송이 일부 실패해도 성공한 건은 저장해야 중복 전송이 없다.
      - name: Save state
        if: always() && steps.watch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .disclosure-state
          key: disclosure-state-${{ github.run_id }}-${{ github.run_attempt }}
